name: Playwright E2E Tests

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]
  workflow_dispatch:

# Cancel superseded CI runs only within the same workflow/event/ref.
# Manual runs keep an independent group so they never cancel PR or push checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Shared E2E checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2

      - name: Generate therapeutic forms index
        run: npm run generate:forms-index

      - name: Validate therapeutic forms index
        run: npm run check:forms-index

      - name: Validate Base44 agent policy
        run: npm run check:agents

      - name: Validate active-agent multilingual benchmark
        run: npm run check:agent-benchmark

      - name: Run unit tests
        run: npm run test

      - name: Build application
        run: npm run build
        env:
          VITE_BASE44_APP_ID: ${{ secrets.VITE_BASE44_APP_ID || 'test-app-id' }}
          VITE_BASE44_APP_BASE_URL: ${{ secrets.VITE_BASE44_APP_BASE_URL || 'http://127.0.0.1:5173' }}

      - name: Run lint
        run: npm run lint

  e2e:
    # All nine browser jobs require the same commit to pass the shared checks.
    needs: checks
    name: E2E ${{ matrix.project }} (${{ matrix.shard }}/${{ matrix.shards }})
    # Private-repository runners have fewer CPUs than public-repository runners.
    # Shard the full suites to retain every case within the existing time budget.
    timeout-minutes: 40
    # Playwright 1.58 supports Ubuntu 24.04; ubuntu-latest can move ahead of it.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project: [web-desktop, mobile-390x844]
        shard: [1, 2, 3, 4]
        shards: [4]
        include:
          - project: smoke-production-critical
            shard: 1
            shards: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > devserver.log 2>&1 &
          echo "Dev server started (logging to devserver.log)"
        env:
          VITE_BASE44_APP_ID: ${{ secrets.VITE_BASE44_APP_ID || 'test-app-id' }}
          VITE_BASE44_APP_BASE_URL: ${{ secrets.VITE_BASE44_APP_BASE_URL || 'http://127.0.0.1:5173' }}

      - name: Wait for server
        run: |
          npx --yes wait-on tcp:127.0.0.1:5173 --timeout 240000
          npx --yes wait-on http-get://127.0.0.1:5173 --timeout 240000
          for attempt in 1 2 3; do
            if curl -sf http://127.0.0.1:5173 > /dev/null; then
              echo "Server is responding on attempt ${attempt}"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Server did not become responsive after retries"
              tail -n 200 devserver.log || true
              exit 1
            fi
            echo "Server not responsive yet (attempt ${attempt}), retrying..."
            sleep 5
          done

      - name: Run Playwright E2E
        run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env:
          CI: true
          BASE_URL: http://127.0.0.1:5173
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:5173
          VITE_BASE44_APP_ID: ${{ secrets.VITE_BASE44_APP_ID || 'test-app-id' }}
          VITE_BASE44_APP_BASE_URL: ${{ secrets.VITE_BASE44_APP_BASE_URL || 'http://127.0.0.1:5173' }}

      - name: Upload dev server log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: devserver-log-${{ matrix.project }}-${{ matrix.shard }}of${{ matrix.shards }}
          path: devserver.log
          retention-days: 7

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}of${{ matrix.shards }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test-results artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.project }}-${{ matrix.shard }}of${{ matrix.shards }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
