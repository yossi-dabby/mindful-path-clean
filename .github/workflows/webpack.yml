name: Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Validate therapeutic forms index
        run: npm run check:forms-index

      - name: Validate Base44 agent policy
        run: npm run check:agents

      - name: Validate active-agent multilingual benchmark
        run: npm run check:agent-benchmark
      
      - name: Build application
        run: npm run build
        env:
          VITE_BASE44_APP_ID: ${{ secrets.VITE_BASE44_APP_ID || '69504b725a07f5aa75aeaf7d' }}
          VITE_BASE44_APP_BASE_URL: ${{ secrets.VITE_BASE44_APP_BASE_URL || 'https://mindful-path-production-7704.up.railway.app' }}
      
      - name: Start preview server
        run: nohup npm run preview > preview-server.log 2>&1 &
        env:
          VITE_BASE44_APP_ID: ${{ secrets.VITE_BASE44_APP_ID || '69504b725a07f5aa75aeaf7d' }}
          VITE_BASE44_APP_BASE_URL: ${{ secrets.VITE_BASE44_APP_BASE_URL || 'https://mindful-path-production-7704.up.railway.app' }}
      
      - name: Wait for server
        run: npx wait-on http://localhost:4173 --timeout 60000
      
      - name: Run tests
        run: npm test
        env:
          SMOKE_TEST_BASE_URL: http://localhost:4173
      
      - name: Upload preview server log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-server-log-${{ matrix.node-version }}
          path: preview-server.log
          retention-days: 7
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '22.x'
        with:
          name: coverage
          path: coverage/
          retention-days: 30

  typecheck-report:
    name: Typecheck Report (informational)
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck report
        run: npm run typecheck:report

      - name: Capture raw typecheck output
        run: npm run typecheck > /tmp/typecheck-raw.txt 2>&1 || true

      - name: Upload typecheck report
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: /tmp/typecheck-raw.txt
          retention-days: 14
