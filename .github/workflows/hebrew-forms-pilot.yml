name: Hebrew Forms Pilot
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'content/hebrew-forms/**'
      - 'scripts/render-hebrew-mood.mjs'
      - 'scripts/render-hebrew-p3.mjs'
      - 'scripts/build-hebrew-p3.py'
      - 'scripts/build-hebrew-p4.py'
      - 'scripts/render-hebrew-p4.mjs'
      - 'base44/functions/getHebrewFormsPilot/**'
      - 'test/utils/hebrewFormsPilot*.test.js'
      - 'src/components/legal/**'
      - 'src/components/i18n/translations.jsx'
      - 'src/components/forms/**'
      - 'src/lib/hebrewFormsPilotClient.js'
      - 'src/pages/TherapeuticForms.jsx'
      - 'tests/pilot/**'
      - 'tests/fixtures/hebrew-pilot*'
      - 'hebrew-pilot.playwright.config.ts'
      - 'pdf-reader.playwright.config.ts'
      - 'english-pilot.playwright.config.ts'
      - 'scripts/build-english-pilot.mjs'
      - 'test/utils/englishFormsPilot.test.js'
      - '.github/workflows/hebrew-forms-pilot.yml'
      - 'package*.json'
      - 'railway.toml'
# Cancel superseded CI runs only within the same workflow/event/ref.
# Manual runs keep an independent group so they never cancel PR or push checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  validate:
    name: Validate Hebrew forms sources and PDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/render-hebrew-mood.mjs
      - run: python3 scripts/build-hebrew-p3.py && git diff --exit-code -- content/hebrew-forms/p3-01
      - run: node scripts/render-hebrew-p3.mjs
      - run: python3 scripts/build-hebrew-p4.py --wave p4-01 && git diff --exit-code -- content/hebrew-forms/p4-01
      - run: node scripts/render-hebrew-p4.mjs --wave=p4-01
      - run: python3 scripts/build-hebrew-p4.py --wave p4-02 && git diff --exit-code -- content/hebrew-forms/p4-02
      - run: node scripts/render-hebrew-p4.mjs --wave=p4-02
      - run: python3 scripts/build-hebrew-p4.py --wave series-01 && git diff --exit-code -- content/hebrew-forms/series-01
      - run: node scripts/render-hebrew-p4.mjs --wave=series-01
      - run: python3 scripts/build-hebrew-p4.py --wave series-02 && git diff --exit-code -- content/hebrew-forms/series-02
      - run: node scripts/render-hebrew-p4.mjs --wave=series-02
      - run: python3 scripts/build-hebrew-p4.py --wave series-03 && git diff --exit-code -- content/hebrew-forms/series-03
      - run: node scripts/render-hebrew-p4.mjs --wave=series-03
      - run: python3 scripts/build-hebrew-p4.py --wave series-04 && git diff --exit-code -- content/hebrew-forms/series-04
      - run: node scripts/render-hebrew-p4.mjs --wave=series-04
      - run: python3 scripts/build-hebrew-p4.py --wave series-05 && git diff --exit-code -- content/hebrew-forms/series-05
      - run: node scripts/render-hebrew-p4.mjs --wave=series-05
      - run: python3 scripts/build-hebrew-p4.py --wave series-06 && git diff --exit-code -- content/hebrew-forms/series-06
      - run: node scripts/render-hebrew-p4.mjs --wave=series-06
      - run: python3 scripts/build-hebrew-p4.py --wave series-07 && git diff --exit-code -- content/hebrew-forms/series-07
      - run: node scripts/render-hebrew-p4.mjs --wave=series-07
      - run: python3 scripts/build-hebrew-p4.py --wave series-08 && git diff --exit-code -- content/hebrew-forms/series-08
      - run: node scripts/render-hebrew-p4.mjs --wave=series-08
      - run: python3 scripts/build-hebrew-p4.py --wave series-09 && git diff --exit-code -- content/hebrew-forms/series-09
      - run: node scripts/render-hebrew-p4.mjs --wave=series-09
      - run: python3 scripts/build-hebrew-p4.py --wave series-10 && git diff --exit-code -- content/hebrew-forms/series-10
      - run: node scripts/render-hebrew-p4.mjs --wave=series-10
      - run: python3 scripts/build-hebrew-p4.py --wave series-11 && git diff --exit-code -- content/hebrew-forms/series-11
      - run: node scripts/render-hebrew-p4.mjs --wave=series-11
      - run: python3 scripts/build-hebrew-p4.py --wave series-12 && git diff --exit-code -- content/hebrew-forms/series-12
      - run: node scripts/render-hebrew-p4.mjs --wave=series-12
  pilot:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [pilot-desktop, pilot-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The fixture serves /Tools from dist, so each isolated job needs its own build.
      - run: npm run build
        env:
          VITE_BASE44_APP_ID: '69504b725a07f5aa75aeaf7d'
      - run: npx playwright test --config hebrew-pilot.playwright.config.ts --project=${{ matrix.project }}
        env:
          VITE_BASE44_APP_ID: '69504b725a07f5aa75aeaf7d'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hebrew-pilot-failure-${{ matrix.project }}
          path: test-results/
          retention-days: 7
  pdf-reader:
    name: PDF reader clarity and gestures
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_BASE44_APP_ID: '69504b725a07f5aa75aeaf7d'
      - run: npx playwright test --config pdf-reader.playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pdf-reader-failure
          path: test-results/
          retention-days: 7
  english-pilot:
    name: English forms language isolation and reader
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-english-pilot.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_BASE44_APP_ID: '69504b725a07f5aa75aeaf7d'
      - run: npx playwright test --config english-pilot.playwright.config.ts
        env:
          VITE_BASE44_APP_ID: '69504b725a07f5aa75aeaf7d'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: english-pilot-failure
          path: test-results/
          retention-days: 7
