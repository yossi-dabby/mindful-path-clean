name: Android Native Build

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'android/**'
      - '.github/workflows/android-native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci
      - name: Build web assets and sync Android
        env:
          VITE_BASE44_APP_ID: '69504b725a07f5aa75aeaf7d'
          VITE_BASE44_APP_BASE_URL: 'https://mindful-path-production-7704.up.railway.app'
          VITE_BASE44_AUTH_BASE_URL: 'https://mindful-path-75aeaf7d.base44.app'
        run: npm run android:build
      - name: Compile diagnostic APK and unsigned release bundle
        working-directory: android
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease --stacktrace

