name: Android Native Build

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'android/**'
      - '.github/workflows/android-native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci
      - name: Build web assets and sync Android
        env:
          VITE_BASE44_APP_ID: '69504b725a07f5aa75aeaf7d'
          VITE_BASE44_APP_BASE_URL: 'https://mindful-path-production-7704.up.railway.app'
          VITE_BASE44_AUTH_BASE_URL: 'https://mindful-path-75aeaf7d.base44.app'
        run: npm run android:build
      - name: Compile diagnostic APK and unsigned release bundle
        working-directory: android
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease --stacktrace


      - name: Verify packaged audio permissions
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          manifests = list(pathlib.Path('android/app/build/intermediates/merged_manifests').glob('**/AndroidManifest.xml'))
          assert manifests, 'No merged Android manifests found'
          android = '{http://schemas.android.com/apk/res/android}'
          required = {'android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS'}
          for manifest in manifests:
              root = ET.parse(manifest).getroot()
              permissions = {node.get(android + 'name'): node for node in root.findall('uses-permission')}
              assert required <= permissions.keys(), f'Missing audio permissions: {manifest}'
              assert all(permissions[name].get(android + 'maxSdkVersion') is None for name in required)
              mic = next((node for node in root.findall('uses-feature') if node.get(android + 'name') == 'android.hardware.microphone'), None)
              assert mic is not None and mic.get(android + 'required') == 'false'
              print(f'Audio permissions verified: {manifest}')
          PY

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostic-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
